# Mosquitto — bus Stellar (MQTT 5)
# Persistence indispensable : les topics retained (home/state, home/discovery,
# home/health) sont le magasin d'états du système.
listener 1883

# allow_anonymous : acceptable tant que le broker est en loopback sur une machine
# de dev. À trancher en P5, quand le broker migre sur le N100 et écoute sur le LAN :
# authentification (password_file) + ACL par driver (un driver n'écrit que sur ses
# propres topics home/state/<driver>/… et ne lit que ses home/cmd/<driver>/…).
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Bornes de sécurité : un driver qui part en boucle ne doit ni saturer la RAM du
# broker ni pousser des payloads déraisonnables (les états Stellar font < 1 Ko).
max_queued_messages 1000
message_size_limit 262144

# Logs horodatés ISO-8601 pour s'aligner sur les logs JSON des process (spec §14).
log_timestamp_format %Y-%m-%dT%H:%M:%S
